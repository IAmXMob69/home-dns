# Optional overlay. Do not bind 0.0.0.0 or [::].
# Requires TAILSCALE_IPV4 in .env (tailscale ip -4).
services:
  pihole:
    ports:
      - "${TAILSCALE_IPV4}:53:53/tcp"
      - "${TAILSCALE_IPV4}:53:53/udp"
    environment:
      FTLCONF_dns_hosts: "${LAN_IPV4} pihole.lan pi.hole;${TAILSCALE_IPV4} pihole.lan pi.hole"
