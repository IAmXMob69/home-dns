# Single-source Unbound harden (Vault.OS). Loaded from custom.conf.d only.
# Outbound: forward to dnscrypt-proxy (anonymized DoH/DoT/DNSCrypt). No plaintext :53 to ISP.
server:
    verbosity: 0
    username: ""

    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: no
    harden-algo-downgrade: yes
    harden-below-nxdomain: yes
    harden-large-queries: yes
    harden-short-bufsize: yes
    deny-any: yes
    use-caps-for-id: no
    qname-minimisation: yes
    qname-minimisation-strict: yes
    aggressive-nsec: yes
    prefetch: yes
    prefetch-key: yes
    hide-identity: yes
    hide-version: yes
    edns-buffer-size: 1232
    minimal-responses: yes
    rrset-roundrobin: yes
    unwanted-reply-threshold: 10000
    tls-cert-bundle: /etc/unbound/ca-certificates.crt
    tls-ciphersuites: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"

    # LAN DoT (clients can use Private DNS / DoT to 192.168.1.X#853)
    interface: 0.0.0.0@853
    tls-port: 853
    tls-service-key: /etc/unbound/tls.key
    tls-service-pem: /etc/unbound/tls.pem

    num-threads: 2
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-min-ttl: 60
    cache-max-ttl: 86400
    so-rcvbuf: 1m
    serve-expired: yes
    serve-expired-ttl: 86400

    private-address: 10.0.x.x/8
    private-address: 172.16.0.0/12
    private-address: 192.168.1.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: ::ffff:0:0/96

    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    access-control: 10.0.x.x/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.1.0/24 allow
    access-control: fd00::/8 allow

forward-zone:
    name: "."
    forward-addr: 172.30.x.x@5353
    forward-tls-upstream: no
