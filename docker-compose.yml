# Pi-hole + Unbound + dnsdist
# Encrypted clients: DoT :853 / DoH :8443 -> dnsdist -> Pi-hole (block) -> Unbound -> dnscrypt-proxy -> internet
# Plain :53 stays published for IoT/DHCP bootstrap. Unbound is compose-network only.
# Admin UI is loopback-only; Tailscale Serve fronts it with HTTPS.
# Host binds are IPv4-only. Never 0.0.0.0 or [::] on a dual-stack host
# (a wildcard bind would be an open resolver).
# Tailscale DNS publishes via docker-compose.tailscale.yml using ${TAILSCALE_IPV4}.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dnscrypt:
    container_name: dnscrypt
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    # dnscrypt-proxy 2.1.19, pinned by digest 2026-10-22 (no upgrade).
    image: klutchell/dnscrypt-proxy@sha256:42c88a9f5e6486c3f0f8266286ffdac8f8d6ebb2a61f414ed57bcf129342862d
    hostname: dnscrypt
    networks:
      default:
        # Static: Unbound forwards to this IP. Do not let IPAM hand .2 to prometheus.
        ipv4_address: 172.30.90.2
    restart: unless-stopped
    cpu_shares: 1024
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    logging: *default-logging
    volumes:
      - ./dnscrypt/dnscrypt-proxy.toml:/config/dnscrypt-proxy.toml:ro
      - dnscrypt_cache:/data
    # Not published to LAN — only Unbound reaches it on the compose network.
    expose:
      - "5353"
    healthcheck:
      test: ["CMD", "dnscrypt-proxy", "-config", "/config/dnscrypt-proxy.toml", "-check"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  unbound:
    container_name: unbound
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    # Unbound 1.26.2, pinned by digest 2026-10-22 (no upgrade).
    image: klutchell/unbound@sha256:50cbeb32b5838a829a7226b19cb151f9535bd7f9f3190f950780f452fe807478
    hostname: unbound
    networks:
      default:
        ipv4_address: 172.30.90.4
    depends_on:
      dnscrypt:
        condition: service_healthy
    restart: unless-stopped
    user: "101:102"
    cpu_shares: 2048
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 256m
    logging: *default-logging
    volumes:
      - ./unbound/custom.conf.d:/etc/unbound/custom.conf.d:ro
      # Host CA bundle, copied by install.sh (Debian/Ubuntu/Arch paths differ).
      - ./unbound/ca-certificates.crt:/etc/unbound/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "dnssec.works"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  pihole:
    container_name: pihole
    # No no-new-privileges here: FTL gets its caps from setcap file caps,
    # which no-new-privileges blocks (tested 2026-10-22: lost NET_BIND/CHOWN).
    pids_limit: 512
    # Pi-hole 2026.10.0, pinned by digest 2026-10-22 (no upgrade).
    image: pihole/pihole:2026.10.0@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
    hostname: pihole
    networks:
      default:
        ipv4_address: 172.30.90.5
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      - "${LAN_IPV4}:53:53/tcp"
      - "${LAN_IPV4}:53:53/udp"
      # Optional LAN IPv6 (EUI-64 only). Never [::].
      # Uncomment and set LAN_IPV6 in .env if you need IPv6 DNS on the LAN:
      # - "[${LAN_IPV6}]:53:53/tcp"
      # - "[${LAN_IPV6}]:53:53/udp"
      - "127.0.0.1:80:80/tcp"
      - "127.0.0.1:443:443/tcp"
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password}
      # No restart/flush calls over the API.
      FTLCONF_webserver_api_allow_destructive: "false"
      # ALL is required inside Docker (LAN clients are not on a container-local subnet).
      # Host publish + UFW/DOCKER-USER are what stop this from being an open resolver.
      FTLCONF_dns_listeningMode: ALL
      # Unbound is the only upstream. Do not add 1.1.1.1 here or ads leak.
      FTLCONF_dns_upstreams: unbound
      # Unbound already validates; double-validation causes false SERVFAILs.
      FTLCONF_dns_dnssec: "false"
      FTLCONF_dns_revServers: "true,${LAN_CIDR},${LAN_GATEWAY},lan"
      FTLCONF_dns_domain_name: lan
      FTLCONF_dns_expandHosts: "true"
      FTLCONF_dns_domainNeeded: "true"
      FTLCONF_dns_bogusPriv: "true"
      FTLCONF_dns_hosts: "${LAN_IPV4} pihole.lan pi.hole;${TAILSCALE_IPV4} pihole.lan pi.hole"
      # Expert profile (2026-09-10): EDE CODE, deep CNAME/ESNI; cache capped at 10000 (dnsmasq warn).
      FTLCONF_dns_cache_size: "10000"
      FTLCONF_dns_rateLimit_count: "2000"
      FTLCONF_dns_rateLimit_interval: "60"
      # Use the client IP that dnsdist passes in ECS (DoT/DoH clients show by IP).
      FTLCONF_dns_EDNS0ECS: "true"
      FTLCONF_dns_blocking_mode: "NULL"
      FTLCONF_dns_blocking_edns: "CODE"
      # CNAME inspect was sinking Facebook graph/gateway via star.c10r CNAME chains.
      FTLCONF_dns_CNAMEdeepInspect: "false"
      FTLCONF_dns_blockESNI: "true"
      FTLCONF_dns_queryLogging: "true"
      FTLCONF_dns_specialDomains_mozillaCanary: "true"
      FTLCONF_dns_specialDomains_iCloudPrivateRelay: "true"
      FTLCONF_resolver_resolveIPv4: "false"
      FTLCONF_resolver_resolveIPv6: "false"
      # Longer local history once Expert unlocks privacy/history panes (still on-box only).
      FTLCONF_database_maxDBdays: "30"
      FTLCONF_database_network_expire: "30"
      FTLCONF_webserver_api_maxHistory: "604800"
      FTLCONF_webserver_api_prettyJSON: "true"
      FTLCONF_misc_privacylevel: "0"
      # UI is loopback + Tailscale Serve (source 127.0.0.1). Exporter is 172.16/12.
      FTLCONF_webserver_acl: "+127.0.0.1,+[::1],+172.16.0.0/12"
      # Do not listen on [::] inside the container either.
      # 80or redirects HTTP to HTTPS when the cert is present; 443os is TLS.
      FTLCONF_webserver_port: "80or,443os"
      # Custom cert in etc-pihole/tls.pem — do not let FTL overwrite it.
      FTLCONF_webserver_tls_validity: "0"
      # CivetWeb/mbedTLS: TLS 1.2+ only, AEAD cipher suites only (no CBC/SHA-1).
      # yamllint disable-line rule:line-length
      FTLCONF_webserver_advancedOpts: '["ssl_protocol_version=4","ssl_cipher_list=TLS1-3-AES-256-GCM-SHA384:TLS1-3-CHACHA20-POLY1305-SHA256:TLS1-3-AES-128-GCM-SHA256:TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-ECDSA-WITH-CHACHA20-POLY1305-SHA256:TLS-ECDHE-RSA-WITH-CHACHA20-POLY1305-SHA256:TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256:TLS-ECDHE-RSA-WITH-AES-128-GCM-SHA256"]'
      FTLCONF_webserver_interface_boxed: "true"
      FTLCONF_webserver_interface_theme: default-dark
      # Docker cannot set the host clock; do not serve NTP on 123/udp either.
      FTLCONF_ntp_sync_active: "false"
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      # Fair scheduler share. -20 starved the desktop session on a 4-core host.
      FTLCONF_misc_nice: "0"
      # Admin UI is loopback/Tailscale Serve only; cut CivetWeb thread pool.
      FTLCONF_webserver_threads: "6"
      FTLCONF_misc_check_load: "true"
    volumes:
      - ./etc-pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    cpu_shares: 2048
    cpus: 1.5
    mem_limit: 1g
    mem_reservation: 512m
    restart: unless-stopped
    # Container's own lookups (list downloads) go to Unbound, never plain public DNS.
    # Plain port-53 egress should be locked to dnscrypt only on the host
    # (for example an nftables inet dns_egress table). Not part of compose.
    dns:
      - 172.30.90.4
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/admin/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  dnsdist:
    container_name: dnsdist
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # dnsdist 1.9.16, pinned by digest 2026-10-22 (no upgrade).
    image: powerdns/dnsdist-19@sha256:260b1120947a10c494fad4d93cde33ebace34bf4800c88ebb114dd7f9e829809
    hostname: dnsdist
    networks:
      default:
        ipv4_address: 172.30.90.8
    depends_on:
      pihole:
        condition: service_healthy
    restart: unless-stopped
    cpu_shares: 512
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    logging: *default-logging
    ports:
      # LAN/loopback DNS-over-TLS. Never 0.0.0.0.
      - "127.0.0.1:853:853/tcp"
      - "${LAN_IPV4}:853:853/tcp"
      # DNS-over-HTTPS (RFC 8484 /dns-query). Never 0.0.0.0.
      - "127.0.0.1:8443:8443/tcp"
      - "${LAN_IPV4}:8443:8443/tcp"
    volumes:
      - ./dnsdist/pihole.conf:/etc/dnsdist/conf.d/pihole.conf:ro
      - ./dnsdist/tls.pem:/etc/dnsdist/certs/tls.pem:ro
      - ./dnsdist/tls.key:/etc/dnsdist/certs/tls.key:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -n >/dev/tcp/127.0.0.1/853'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: docker compose --profile monitoring up -d
  pihole-exporter:
    profiles: ["monitoring"]
    container_name: pihole-exporter
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    networks:
      default:
        ipv4_address: 172.30.90.3
    # Go build (go/cmd/pihole-exporter). Python fallback: context ./monitoring,
    # dockerfile Dockerfile.
    build:
      context: ./go
      dockerfile: Dockerfile.exporter
    environment:
      PIHOLE_HOSTNAME: pihole
      PIHOLE_PORT: "80"
      PIHOLE_PASSWORD: ${FTLCONF_webserver_api_password}
      PIHOLE_PROTOCOL: http
      EXPORTER_PORT: "9617"
    volumes:
      - ./etc-pihole:/etc/pihole:ro
    ports:
      - "127.0.0.1:9617:9617"
    cpu_shares: 128
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      pihole:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    container_name: prometheus
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      default:
        ipv4_address: 172.30.90.7
    # Prometheus 3.14.0, pinned by digest 2026-10-22 (no upgrade).
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    cpu_shares: 256
    cpus: 0.5
    mem_limit: 1g
    mem_reservation: 512m
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - pihole-exporter

  grafana:
    profiles: ["monitoring"]
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    networks:
      default:
        ipv4_address: 172.30.90.6
    # Grafana 13.2.1, pinned by digest 2026-10-22 (no upgrade).
    image: grafana/grafana@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    cpu_shares: 256
    cpus: 0.5
    mem_limit: 768m
    mem_reservation: 384m
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - prometheus

volumes:
  dnscrypt_cache:
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.90.0/24
