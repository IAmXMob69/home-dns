name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 06:17 UTC: catches resolvers/relays that vanish upstream.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DNSCRYPT_PROXY_VERSION: "2.1.19"
  RUFF_VERSION: "0.17.1"
  YAMLLINT_VERSION: "1.38.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh *.sh lib/*.sh automation/*.sh automation/india-inbound/*.sh tests/*.sh tests/netns/*.sh
      - name: yamllint
        run: |
          pip install "yamllint==${YAMLLINT_VERSION}"
          yamllint .
      - name: ruff
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff check .
      - name: python tests (mocked Pi-hole v6 API)
        run: |
          pip install requests prometheus_client
          python tests/test_exporter.py
          python tests/test_pihole_groups.py
          python tests/test_nft_counters.py

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - name: vet, test, build
        working-directory: go
        run: |
          go vet ./...
          go test ./...
          go build ./...
      - name: India IDN TLD list matches indic-idn-guard
        run: |
          diff <(grep -v '^#' geolock/pihole/india-lang-regex.txt | grep -o 'xn--[a-z0-9-]*' | sort) \
               <(grep -o '^\s*"xn--[a-z0-9-]*"' go/cmd/indic-idn-guard/main.go | tr -d ' \t"' | sort)

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: |
          cp .env.example .env
          sed -i 's/^LAN_IPV4=.*/LAN_IPV4=192.0.2.10/; s/^TAILSCALE_IPV4=.*/TAILSCALE_IPV4=100.64.0.10/' .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.tailscale.yml config --quiet
          docker compose --profile monitoring config --quiet
          docker compose -f docker-compose.yml -f monitoring/docker-compose.nft-counters.yml \
            --profile monitoring config --quiet

  dnscrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: resolver and relay names exist in the live lists
        run: python scripts/check-dnscrypt-names.py dnscrypt/dnscrypt-proxy.toml
      - name: dnscrypt-proxy -check
        run: |
          v="${DNSCRYPT_PROXY_VERSION}"
          curl -fsSL -o dp.tgz \
            "https://github.com/DNSCrypt/dnscrypt-proxy/releases/download/${v}/dnscrypt-proxy-linux_x86_64-${v}.tar.gz"
          tar xzf dp.tgz
          mkdir -p "$RUNNER_TEMP/dnscrypt-data"
          sed "s#/data/#$RUNNER_TEMP/dnscrypt-data/#g" dnscrypt/dnscrypt-proxy.toml > "$RUNNER_TEMP/dp.toml"
          ./linux-x86_64/dnscrypt-proxy -config "$RUNNER_TEMP/dp.toml" -check

  nftables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - name: install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - name: geolock ruleset builds and passes nft -c (Bash and Go agree)
        run: |
          (cd go && go build -o "$RUNNER_TEMP/geolock-apply" ./cmd/geolock-apply)
          printf 'GEOLOCK_ENABLED=1\nGEOLOCK_MODE=allow\nGEOLOCK_ALLOW_COUNTRIES=US,DE\n' > "$RUNNER_TEMP/allow.env"
          grep '^GEOLOCK_DENY_COUNTRIES=' geolock/settings.env.example > "$RUNNER_TEMP/deny.env"
          printf 'GEOLOCK_ENABLED=1\nGEOLOCK_MODE=deny\n' >> "$RUNNER_TEMP/deny.env"
          for mode in allow deny; do
            for extra in "" "GEOLOCK_IPV6=1" "GEOLOCK_IPV6=1 GEOLOCK_INBOUND=0" "GEOLOCK_IPV6=1 GEOLOCK_OUTBOUND=0" \
                "GEOLOCK_OUTBOUND=0"; do
              echo "== $mode $extra"
              { cat "$RUNNER_TEMP/$mode.env"; printf '%s\n' $extra; } > "$RUNNER_TEMP/case.env"
              sudo GEOLOCK_SETTINGS="$RUNNER_TEMP/case.env" GEOLOCK_CACHE="$RUNNER_TEMP/geo" GEOLOCK_DRY_RUN=1 \
                PIHOLE_NO_GO=1 bash scripts/geolock-apply.sh
              cp "$RUNNER_TEMP/geo/geolock.nft" "$RUNNER_TEMP/bash.nft"
              sudo GEOLOCK_SETTINGS="$RUNNER_TEMP/case.env" GEOLOCK_CACHE="$RUNNER_TEMP/geo" GEOLOCK_DRY_RUN=1 \
                PIHOLE_ROOT="$PWD" "$RUNNER_TEMP/geolock-apply"
              cmp "$RUNNER_TEMP/bash.nft" "$RUNNER_TEMP/geo/geolock.nft"
            done
          done
      - name: geolock in a throwaway netns (DNS probes, IPv4/IPv6, rollback, counters)
        run: |
          (cd go && go build -o bin/geolock-apply ./cmd/geolock-apply)
          sudo unshare -n env GEOLOCK_GO_BIN="$PWD/go/bin/geolock-apply" bash tests/netns/geolock-netns.sh
      - name: boot installer against a fake root
        run: sudo bash tests/install-geolock-system-test.sh
      - name: malice ruleset loads in a throwaway netns
        run: |
          curl -fsSL -o "$RUNNER_TEMP/level1.netset" \
            https://raw.githubusercontent.com/firehol/blocklist-ipsets/master/firehol_level1.netset
          sudo MALICE_NFT_DIR="$RUNNER_TEMP/nftables.d" MALICE_NFT_CONF=/nonexistent \
            MALICE_URL="file://$RUNNER_TEMP/level1.netset" unshare -n bash scripts/malice-ip-apply.sh
      - name: india inbound block loads in a throwaway netns
        run: |
          sudo unshare -n nft -c -f automation/india-inbound/india-inbound-block.nft
          sudo unshare -n bash -c 'nft -f automation/india-inbound/india-inbound-block.nft && nft list table inet india_inbound >/dev/null'
