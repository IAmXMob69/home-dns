# Example of what scripts/install-geolock-system.sh installs as
# /etc/systemd/system/vaultos-country-block.service.d/10-home-dns-geolock.conf.
# Prefer the script: it checks the new copy renders the live ruleset
# byte-for-byte first, backs up, and can roll back.
#
# The empty line clears the unit's own "ExecStartPost=-<checkout>/scripts/geolock-apply.sh";
# without the leading "-", a failed geolock now fails the unit instead of being ignored.
[Service]
ExecStartPost=
ExecStartPost=/usr/local/lib/home-dns/geolock
