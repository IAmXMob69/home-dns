[Service]
# At boot the timer catch-up can fire before Docker has the stack up; wait (max 150s) for pihole to report healthy.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do [ "$(docker inspect -f "{{.State.Health.Status}}" pihole 2>/dev/null)" = healthy ] && exit 0; sleep 5; done; exit 0'
TimeoutStartSec=300
